[tox]
isolated_build = true
skipsdist = true
usedevelop = true
envlist = {py310, py311, py312}-django42

[testenv]
setenv =
    django42: DJANGO_SETTINGS_MODULE = tests.test_settingsAA4
    AA_USE_FAKE_REDIS = 1
deps=
    django42: allianceauth>=4.0.0,<5
    fakeredis>=2
    coverage

install_command = pip install -e ".[test]" -U {opts} {packages}

commands=
    coverage run runtests.py allianceauth_oidc -v 2 --debug-mode
    pip list
    coverage xml
    coverage html
    coverage report -m
